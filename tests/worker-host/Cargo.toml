[package]
name = "proofcredit-worker-host"
version = "0.1.0"
edition = "2024"
[workspace]
[features]
test-hooks = []
[dependencies]
anyhow = "=1.0.104"
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "=1.54.1", features = ["full", "test-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasmtime = { version = "=50.0.1", default-features = false, features = ["anyhow", "std", "runtime", "cranelift", "component-model", "async"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p2"] }
wasmtime-wasi-io = { version = "=50.0.1" }
wasmtime-wasi-http = { version = "=50.0.1", default-features = false, features = ["p2", "default-send-request"] }
rcgen = "=0.14.7"
[dev-dependencies]
rlp = "=0.5.2"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
