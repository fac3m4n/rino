[package]
name = "rino-proof-pipeline"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dev-dependencies]
near-api = "=0.8.7"
near-sandbox = "=0.4.0"
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
rino-controller = { path = "../../contracts/controller" }
rino-proof-protocol = { path = "../../crates/proof-protocol" }
rino-proof-worker = { path = "../../workers/collateral-proof" }
serde_json = "=1.0.154"
tokio = { version = "=1.49.0", features = ["full"] }
reqwest = { version = "=0.12.28", features = ["json"] }
base64 = "=0.22.1"
rlp = "=0.5.2"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
