[package]
name = "rino-controller"
description = "Immutable derived-vault proof controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
rino-loan-core = { path = "../../crates/loan-core" }
rino-settlement-protocol = { path = "../../crates/settlement-protocol" }
rino-proof-protocol = { path = "../../crates/proof-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic"] }

[dev-dependencies]
rlp = "=0.5.2"
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
