[package]
name = "proofcredit-settlement-protocol"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
proofcredit-collateral-proof = { path = "../collateral-proof" }
proofcredit-proof-protocol = { path = "../proof-protocol" }
proofcredit-loan-core = { path = "../loan-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
hex = "=0.4.3"

[dev-dependencies]
rlp = "=0.5.2"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
